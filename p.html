<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Kimse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #2667AA 0%, #1a4a7a 50%, #0f3460 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 360px;
    }

    img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      margin-bottom: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
      border: 3px solid rgba(255, 255, 255, 0.2);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    p {
      font-size: 1.05rem;
      opacity: 0.9;
      margin-bottom: 28px;
    }

    a.button {
      display: block;
      padding: 14px 20px;
      margin-bottom: 12px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.6);
    }

    a.button.primary {
      background: #fff;
      color: #1a4a7a;
      border-color: #fff;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="Kimse" />
    <h1>Kimse</h1>
    <p>Bu gönderi Kimse uygulamasında açılır.</p>
    <a class="button primary" id="open" hidden>Uygulamada aç</a>
    <a class="button" id="play" href="https://play.google.com/store/apps/details?id=com.kimse.app">Google Play'den indir</a>
    <a class="button" id="appstore" href="https://apps.apple.com/app/id6759622316">App Store'dan indir</a>
  </main>
  <script>
    (function () {
      var PLAY = 'https://play.google.com/store/apps/details?id=com.kimse.app';
      var APP_STORE = 'https://apps.apple.com/app/id6759622316';
      var LINK = 'perception44.github.io/kimse-pages/p';

      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      // iPadOS masaüstü kimliğiyle gelir: dokunmatik Mac yoktur
      var isIos = /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

      // Kimlik yalnızca harf ve rakamdan oluşur; başka her şey yok sayılır
      var match = /[?&]id=([A-Za-z0-9]{1,64})(?:&|$)/.exec(location.search);
      var id = match ? match[1] : '';

      var play = document.getElementById('play');
      var appStore = document.getElementById('appstore');
      var open = document.getElementById('open');

      // Aynı sekmede yalnızca bir kez kendiliğinden yönlendirilir (geri dönünce sayfa kalır)
      var firstVisit = true;
      try {
        var key = 'kimse-p-' + id;
        firstVisit = !sessionStorage.getItem(key);
        sessionStorage.setItem(key, '1');
      } catch (e) {}

      if (isAndroid) {
        appStore.hidden = true;
        play.className = 'button';
        var target = PLAY;
        if (id) {
          // Uygulama yüklüyse gönderiyi açar, değilse Google Play'e gider
          target = 'intent://' + LINK + '?id=' + id +
            '#Intent;scheme=https;package=com.kimse.app;' +
            'S.browser_fallback_url=' + encodeURIComponent(PLAY) + ';end';
          open.href = target;
          open.hidden = false;
        } else {
          play.className = 'button primary';
        }
        if (firstVisit) location.href = target;
      } else if (isIos) {
        play.hidden = true;
        appStore.className = 'button primary';
        if (firstVisit) location.href = APP_STORE;
      }
    })();
  </script>
</body>
</html>
