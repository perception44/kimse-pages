<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Kimse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @font-face {
      font-family: Selawik;
      font-weight: 400;
      font-display: swap;
      src: url("fonts/Selawik-Regular.woff2") format("woff2");
    }

    @font-face {
      font-family: Selawik;
      font-weight: 700;
      font-display: swap;
      src: url("fonts/Selawik-Bold.woff2") format("woff2");
    }

    body {
      font-family: Selawik, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #2667AA 0%, #1a4a7a 50%, #0f3460 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 360px;
    }

    img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      margin-bottom: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
      border: 3px solid rgba(255, 255, 255, 0.2);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      font-size: 1.05rem;
      opacity: 0.9;
      margin-bottom: 28px;
    }

    a.button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      margin-bottom: 12px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.6);
    }

    a.button.primary {
      background: #fff;
      color: #1a4a7a;
      border-color: #fff;
    }

    a.button svg,
    a.button img {
      width: 22px;
      height: 22px;
      flex: none;
      margin: 0;
      border: 0;
      border-radius: 6px;
      box-shadow: none;
      fill: currentColor;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="Kimse" />
    <h1>Kimse</h1>
    <p>Bu gönderi seni Kimse'de bekliyor<br />Gel, bir bak 🤍</p>
    <a class="button primary" id="open" hidden><img src="logo.png" alt="" />Uygulamada aç</a>
    <a class="button" id="play" href="https://play.google.com/store/apps/details?id=com.kimse.app"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>Google Play'den indir</a>
    <a class="button" id="appstore" href="https://apps.apple.com/app/id6759622316"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>App Store'dan indir</a>
  </main>
  <script>
    (function () {
      var PLAY = 'https://play.google.com/store/apps/details?id=com.kimse.app';
      var APP_STORE = 'https://apps.apple.com/app/id6759622316';
      var LINK = 'perception44.github.io/kimse-pages/p';

      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      // iPadOS masaüstü kimliğiyle gelir: dokunmatik Mac yoktur
      var isIos = /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

      // Kimlik yalnızca harf ve rakamdan oluşur; başka her şey yok sayılır
      var match = /[?&]id=([A-Za-z0-9]{1,64})(?:&|$)/.exec(location.search);
      var id = match ? match[1] : '';

      var play = document.getElementById('play');
      var appStore = document.getElementById('appstore');
      var open = document.getElementById('open');

      // Aynı sekmede yalnızca bir kez kendiliğinden yönlendirilir (geri dönünce sayfa kalır)
      var firstVisit = true;
      try {
        var key = 'kimse-p-' + id;
        firstVisit = !sessionStorage.getItem(key);
        sessionStorage.setItem(key, '1');
      } catch (e) {}

      if (isAndroid) {
        appStore.hidden = true;
        play.className = 'button';
        var target = PLAY;
        if (id) {
          // Uygulama yüklüyse gönderiyi açar, değilse Google Play'e gider
          target = 'intent://' + LINK + '?id=' + id +
            '#Intent;scheme=https;package=com.kimse.app;' +
            'S.browser_fallback_url=' + encodeURIComponent(PLAY) + ';end';
          open.href = target;
          open.hidden = false;
        } else {
          play.className = 'button primary';
        }
        if (firstVisit) location.href = target;
      } else if (isIos) {
        play.hidden = true;
        appStore.className = 'button primary';
        if (firstVisit) location.href = APP_STORE;
      }
    })();
  </script>
</body>
</html>
